[platformio]
default_envs = motor_driver_s3, joystick1, joystick2

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library @ ^3.0.2
    makuna/NeoPixelBus @ ^2.8.3
build_flags =
    -DCAN_BITRATE=250000
    -DPROTOCOL_PRIORITY_DEFAULT=6
    -DWATCHDOG_TIMEOUT_MS=1000

; --- Motor Driver (ESP32-S3) ---
[env:motor_driver_s3]
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
build_flags =
    ${env.build_flags}
    -DECU_TYPE_MOTOR_DRIVER
    -DECU_PREFERRED_ADDRESS=0x20
    -DECU_NAME_MOTOR_DRIVER=0x01
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_I2CDEV_NOLOCK=1
    -DCAN_TX_PIN=17
    -DCAN_RX_PIN=16
    -DWS2812_PIN=39
    -DPCA9685_SDA=8
    -DPCA9685_SCL=18
    -DPCA9685_I2C_ADDR1=0x40
    -DPCA9685_I2C_ADDR2=0x41
    -DSAFETY_TIMEOUT_MS=200
build_src_filter = +<main.cpp> +<ecu_motor_driver.cpp> +<can_output.cpp> +<ota_webserver.cpp> +<web_state.cpp>

[env:motor_driver_s3_ota]
extends = env:motor_driver_s3
build_flags =
    ${env:motor_driver_s3.build_flags}
    -DENABLE_OTA_WEBSERVER
lib_deps =
    ${env.lib_deps}
    pangodream/ESP2SOTA @ ^1.0.1

; --- Minimal test env (debug only) ---
[env:motor_test_minimal]
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
platform = espressif32
framework = arduino
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
lib_ignore = Adafruit PWM Servo Driver Library, NeoPixelBus
build_src_filter = +<main.cpp>

; --- Motor Driver S3 via UART (no USB-CDC) ---
[env:motor_driver_s3_uart]
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
upload_speed = 460800
upload_flags =
    --after
    soft_reset
build_flags =
    ${env.build_flags}
    -DECU_TYPE_MOTOR_DRIVER
    -DECU_PREFERRED_ADDRESS=0x20
    -DECU_NAME_MOTOR_DRIVER=0x01
    -DCONFIG_I2CDEV_NOLOCK=1
    -DCAN_TX_PIN=17
    -DCAN_RX_PIN=16
    -DWS2812_PIN=39
    -DPCA9685_SDA=8
    -DPCA9685_SCL=18
    -DPCA9685_I2C_ADDR1=0x40
    -DPCA9685_I2C_ADDR2=0x41
    -DSAFETY_TIMEOUT_MS=200

[env:motor_driver_s3_uart_ota]
extends = env:motor_driver_s3_uart
upload_flags =
    --after
    soft_reset
build_flags =
    ${env:motor_driver_s3_uart.build_flags}
    -DENABLE_OTA_WEBSERVER

; --- Motor Driver (legacy T-CAN) ---
[env:motor_driver]
build_flags =
    ${env.build_flags}
    -DECU_TYPE_MOTOR_DRIVER
    -DECU_PREFERRED_ADDRESS=0x20
    -DECU_NAME_MOTOR_DRIVER=0x01
    -DCAN_TX_PIN=5
    -DCAN_RX_PIN=4
    -DWS2812_PIN=48
    -DPCA9685_SDA=21
    -DPCA9685_SCL=22
    -DPCA9685_I2C_ADDR1=0x40
    -DPCA9685_I2C_ADDR2=0x41
    -DSAFETY_TIMEOUT_MS=200
build_src_filter = +<main.cpp> +<ecu_motor_driver.cpp> +<can_output.cpp> +<ota_webserver.cpp> +<web_state.cpp>

[env:joystick1]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DECU_TYPE_JOYSTICK
    -DECU_PREFERRED_ADDRESS=0x21
    -DECU_JOYSTICK_ID=1
    -DCAN_TX_PIN=27
    -DCAN_RX_PIN=26
    -DCAN_SPEED_MODE_PIN=23
    -DCAN_ME2107_EN_PIN=16
    -DWS2812_PIN=4
    -DPOT1_PIN=32
    -DPOT2_PIN=33
    -DPOT3_PIN=34
    -DPOT4_PIN=35
    -DBTN1_PIN=12
    -DBTN2_PIN=5
    -DBTN3_PIN=18
    -DBTN4_PIN=8

[env:joystick2]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DECU_TYPE_JOYSTICK
    -DECU_PREFERRED_ADDRESS=0x22
    -DECU_JOYSTICK_ID=2
    -DCAN_TX_PIN=27
    -DCAN_RX_PIN=26
    -DCAN_SPEED_MODE_PIN=23
    -DCAN_ME2107_EN_PIN=16
    -DWS2812_PIN=4
    -DPOT1_PIN=32
    -DPOT2_PIN=33
    -DPOT3_PIN=34
    -DPOT4_PIN=35
    -DBTN1_PIN=12
    -DBTN2_PIN=5
    -DBTN3_PIN=18
    -DBTN4_PIN=8

[env:motor_driver_ota]
extends = env:motor_driver
build_flags =
    ${env:motor_driver.build_flags}
    -DENABLE_OTA_WEBSERVER

[env:joystick1_ota]
extends = env:joystick1
build_flags =
    ${env:joystick1.build_flags}
    -DENABLE_OTA_WEBSERVER

[env:joystick2_ota]
extends = env:joystick2
build_flags =
    ${env:joystick2.build_flags}
    -DENABLE_OTA_WEBSERVER

; --- New PCB Hardware Test (ESP32-S3R8N8 CAN Board) ---
[env:newpcb_test]
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DI2C_SDA=39
    -DI2C_SCL=38
    -DCAN_TX_PIN=10
    -DCAN_RX_PIN=11
    -DLED1_PIN=48
    -DLED2_PIN=47
    -DSWITCH_PIN=18
lib_deps =
    adafruit/Adafruit ADS1X15 @ ^2.5.0
lib_ignore = Adafruit PWM Servo Driver Library, NeoPixelBus
build_src_filter = +<newpcb_test.cpp>

; --- Joystick Full (ESP32-S3R8N8 CAN Board) ---
; Unified joystick with all inputs/outputs
; CAN Address: 0x80
; - 4 ADS1115 channels
; - 8 buttons from main PCA9555 @ 0x20
; - 16 buttons from extender PCA9555 @ 0x21
; - Optocoupler control via extender PCA9555
[env:joystick_full]
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCAN_BITRATE=250000
lib_deps =
    adafruit/Adafruit ADS1X15 @ ^2.5.0
lib_ignore = Adafruit PWM Servo Driver Library, NeoPixelBus
build_src_filter = +<joystick_full.cpp>

; --- Joystick AUX-N (ESP32-S3R8N8 CAN Board) ---
; Real ISO 11783-6 AUX-N (Auxiliary Control Type 2) joystick, built on the
; AgIsoStack-plus-plus ISOBUS library. Speaks genuine ISOBUS (not this repo's
; proprietary protocol) - plugs into any ISO 11783 network / Virtual Terminal.
; - 4 ADS1115 channels -> analog AUX-N inputs
; - 16 buttons from extender PCA9555 -> boolean AUX-N inputs
; - Object pool (see src/object_pool/, generated by tools/build_aux_pool.py):
;   Working Set + one Data Mask showing "TEST"
; Mixed arduino+espidf framework: espidf gives us AgIsoStack's TWAI plugin;
; arduino keeps WiFi/WebServer/ESP2SOTA for OTA. This mix needs two sdkconfig
; overrides (see sdkconfig.joystick_aux_n - PlatformIO auto-picks up a file
; named sdkconfig.<envname>): CONFIG_FREERTOS_HZ=1000 (arduino-esp32 hard
; requirement) and CONFIG_AUTOSTART_ARDUINO=y (without it, app_main() -
; which calls Arduino's setup()/loop() - compiles out entirely and the link
; fails with "undefined reference to app_main"). Under espidf, PlatformIO's
; build_src_filter is ignored, so src/CMakeLists.txt explicitly selects only
; joystick_aux_n.cpp - see that file. The object pool is compiled in as a
; plain C byte array (src/object_pool/aux_n_pool_data.h, generated by
; tools/build_aux_pool.py) rather than linker-embedded: PlatformIO's
; board_build.embed_files mechanism turned out not to fire under this
; specific mixed-framework build. Uses its own partition table
; (partitions_aux_n_8mb.csv, same OTA-capable layout as Arduino's
; default_8MB.csv) since that name isn't resolvable under ESP-IDF's
; CMake-based partition lookup.
[env:joystick_aux_n]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.flash_size = 8MB
board_build.partitions = partitions_aux_n_8mb.csv
board_upload.flash_size = 8MB
framework = arduino, espidf
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit ADS1X15 @ ^2.5.0
    https://github.com/Open-Agriculture/AgIsoStack-plus-plus.git#509a920cadff634612e8972158e1c293c9f372c7
; This firmware doesn't use the repo's proprietary-protocol libs at all (it
; talks real ISOBUS via AgIsoStack instead) - excluded because PlatformIO's
; LDF pulls in everything under lib/ for espidf builds regardless of actual
; #includes, and their pre-existing warnings become hard errors under this
; env's stricter (ESP-IDF-influenced) -Werror flags.
lib_ignore = Adafruit PWM Servo Driver Library, NeoPixelBus, ForwarderCAN, ForwarderConfig, WT5500Eth

[env:joystick_aux_n_ota]
extends = env:joystick_aux_n
build_flags =
    ${env:joystick_aux_n.build_flags}
    -DENABLE_OTA_WEBSERVER
lib_deps =
    ${env:joystick_aux_n.lib_deps}
    pangodream/ESP2SOTA @ ^1.0.1
